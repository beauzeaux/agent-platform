apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-management-tools
  namespace: cluster-management
  labels:
    app.kubernetes.io/managed-by: host-capabilities-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cluster-management-tools
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: factory-executions
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atenet-egress
      ports:
        - protocol: TCP
          port: 8084
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.82.0.2/32
        - ipBlock:
            cidr: 10.82.0.3/32
        - ipBlock:
            cidr: 10.82.0.4/32
      ports:
        - protocol: TCP
          port: 16443
    - to:
        - ipBlock:
            cidr: 10.152.183.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
