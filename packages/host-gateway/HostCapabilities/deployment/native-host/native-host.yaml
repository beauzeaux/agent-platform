apiVersion: v1
kind: Service
metadata:
  name: host-capabilities
  namespace: proxy-access
  labels:
    app.kubernetes.io/name: host-capabilities
    app.kubernetes.io/managed-by: host-capabilities-native-host
spec:
  type: ClusterIP
  ports:
    - name: native-https
      protocol: TCP
      appProtocol: https
      port: 8445
      targetPort: 15445
    - name: native-imds
      protocol: TCP
      appProtocol: https
      port: 8446
      targetPort: 15445
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: host-capabilities-native-primary
  namespace: proxy-access
  labels:
    kubernetes.io/service-name: host-capabilities
    endpointslice.kubernetes.io/managed-by: host-capabilities-native-host
    app.kubernetes.io/managed-by: host-capabilities-native-host
addressType: IPv4
ports:
  - name: native-https
    protocol: TCP
    appProtocol: https
    port: 15445
  - name: native-imds
    protocol: TCP
    appProtocol: https
    port: 15445
endpoints:
  - addresses:
      - 10.82.0.2
    conditions:
      ready: true
