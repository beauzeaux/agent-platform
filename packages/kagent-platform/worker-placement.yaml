apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-default
  namespace: kagent
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              ate.dev/worker-pool: kagent-default
