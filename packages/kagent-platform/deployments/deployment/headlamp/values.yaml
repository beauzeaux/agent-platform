fullnameOverride: headlamp
config:
  inCluster: true
  baseURL: /headlamp
  enableHelm: false
  oidc:
    secret:
      create: false
clusterRoleBinding:
  create: false
serviceAccount:
  create: true
  name: headlamp
service:
  type: ClusterIP
  port: 80
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
