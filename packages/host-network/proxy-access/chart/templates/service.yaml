apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-proxies.name" . }}
  labels:
    {{- include "agent-proxies.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-proxies.selector" . | nindent 4 }}
  ports:
    - name: session
      port: 8443
      targetPort: session
    - name: data
      port: 8444
      targetPort: data
