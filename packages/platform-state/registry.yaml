apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kagent-lab-registry
  namespace: kagent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: microk8s-hostpath-devdrive
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: kagent
spec:
  selector:
    app: kagent-lab-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-lab-registry
  namespace: kagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kagent-lab-registry
  template:
    metadata:
      labels:
        app: kagent-lab-registry
    spec:
      nodeSelector:
        devbox-name: xl-devbox
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kagent-lab-registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-lab-registry
  namespace: kagent
spec:
  podSelector:
    matchLabels:
      app: kagent-lab-registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atelet
      ports:
        - protocol: TCP
          port: 5000
