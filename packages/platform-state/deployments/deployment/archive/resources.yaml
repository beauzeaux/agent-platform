apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factory-session-archives
  namespace: ate-system
  labels:
    app.kubernetes.io/part-of: host-capabilities
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: factory-executions
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: factory
      ports:
        - protocol: TCP
          port: 9000
