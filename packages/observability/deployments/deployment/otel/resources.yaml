apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: host-otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/instance: host-otel
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: host-otel
  endpoints:
    - port: metrics-export
      interval: 15s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: host-otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/instance: host-otel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: host-otel
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atenet-egress
      ports:
        - protocol: TCP
          port: 4317
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8889
    - from:
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 4318
